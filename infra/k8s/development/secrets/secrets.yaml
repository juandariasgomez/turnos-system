apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: juandariasgomez-dev
type: Opaque
stringData:
  DB_HOST: ${DB_HOST}
  DB_NAME: ${DB_NAME}
  DB_PASS: ${DB_PASS}
  DB_PORT: ${DB_PORT}
  DB_USER: ${DB_USER}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  PORT: ${PORT}